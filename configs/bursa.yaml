# Bursa Haritası Konfigürasyonu

# SUMO Configuration
sumo_cfg: "data/scenarios/bursa/bursa.sumocfg"
net_file: "data/scenarios/bursa/new_clean.net.xml"
route_file: "data/scenarios/bursa/traffic_low_new.rou.xml"

# Environment Settings
use_gui: false
num_seconds: 1000   # Simülasyon süresi (saniye)
yellow_time: 3      # Sarı faz süresi
min_green_time: 10  # Minimum yeşil süre
max_green_time: 60  # Maksimum yeşil süre
delta_time: 5       # Ajan aksiyon aralığı (saniye)

# Training Settings
algorithm: "dqn"
num_episodes: 500   # Episode sayısı
max_steps: 1000     # Episode başına maksimum adım
device: "cpu"

# DQN Hyperparameters
lr: 0.001
gamma: 0.99
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay: 0.995
batch_size: 64
buffer_size: 10000
target_update_freq: 100

# Logging and Checkpoints
checkpoint_dir: "experiments/checkpoints/bursa"
log_dir: "experiments/logs/bursa"
save_freq: 50    # Her 50 episode'da kaydet
eval_freq: 25    # Her 25 episode'da değerlendir

# Multi-Agent Settings (12 trafik ışığı)
multi_agent: true
num_agents: 12

# Evaluation
eval_episodes: 5
eval_use_gui: false
