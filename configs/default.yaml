# Default configuration for MARL traffic signal control

# SUMO Configuration
sumo_cfg: "data/scenarios/single_intersection/single_intersection.sumocfg"
net_file: "data/scenarios/single_intersection/single_intersection.net.xml"
route_file: "data/scenarios/single_intersection/single_intersection.rou.xml"

# Environment Settings
use_gui: false
num_seconds: 3600  # Simulation duration in seconds
yellow_time: 3     # Yellow phase duration
min_green_time: 10 # Minimum green phase duration
max_green_time: 60 # Maximum green phase duration
delta_time: 5      # Time step for agent actions

# Training Settings
algorithm: "dqn"  # dqn, maddpg, qmix
num_episodes: 1000
max_steps: 3600
device: "cpu"  # cpu or cuda

# DQN Hyperparameters
lr: 0.001
gamma: 0.99
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay: 0.995
batch_size: 64
buffer_size: 10000
target_update_freq: 100

# MADDPG Hyperparameters
lr_actor: 0.001
lr_critic: 0.001
tau: 0.01
noise: 0.1

# QMIX Hyperparameters
tau: 0.005

# Logging and Checkpoints
checkpoint_dir: "experiments/checkpoints"
log_dir: "experiments/logs"
save_freq: 100  # Save checkpoint every N episodes
eval_freq: 50   # Evaluate every N episodes

# Evaluation
eval_episodes: 10
eval_use_gui: false
